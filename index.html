<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>Onkel Hasan</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #0f172a, #000);
        overflow: hidden;
        font-family: Georgia, serif;
      }

      /* ── CANVAS ── */
      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      /* ── SCROLL ROOT ── */
      #sr {
        position: fixed;
        inset: 0;
        overflow-y: scroll;
        overflow-x: hidden;
        z-index: 1;
      }
      #sr::-webkit-scrollbar {
        display: none;
      }
      #track {
        height: 200vh;
        pointer-events: none;
      }

      /* ── STAGE ── */
      #stage {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
      }

      /* ── RIBBON PIECES ── */
      .rp {
        position: absolute;
        pointer-events: none;
        will-change: transform, opacity;
        transform-origin: center center;
      }
      .rp .piece-svg {
        display: block;
        width: 120px;
        height: 120px;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.15));
      }

      /* ── KNOT FLASH ── */
      #knot-flash {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(236, 34, 39, 0.6) 0%,
          transparent 65%
        );
        opacity: 0;
        pointer-events: none;
        will-change: opacity;
      }

      /* ── LOGO ── */
      #logo {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        z-index: 6;
        opacity: 0;
        will-change: transform, opacity;
        pointer-events: none;
        width: min(82vw, 480px);
        height: min(82vw, 480px);
      }
      #logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
        display: block;
      }
      #logo::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: transparent;
        box-shadow: 0 0 0 0 rgba(236, 34, 39, 0);
        will-change: box-shadow;
      }

      /* ── SCROLL HINT ── */
      #hint {
        position: fixed;
        bottom: clamp(20px, 4vh, 44px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #hint span {
        font-size: clamp(8px, 1.4vw, 10px);
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.28);
      }
      .sline {
        width: 1px;
        height: clamp(28px, 4vh, 44px);
        background: linear-gradient(
          to bottom,
          rgba(236, 34, 39, 0.8),
          transparent
        );
        animation: sdrop 1.9s ease-in-out infinite;
      }
      @keyframes sdrop {
        0% {
          transform: scaleY(0);
          transform-origin: top;
          opacity: 1;
        }
        55% {
          transform: scaleY(1);
          transform-origin: top;
          opacity: 1;
        }
        100% {
          transform: scaleY(1);
          transform-origin: bottom;
          opacity: 0;
        }
      }

      /* ── TAGLINE ── */
      #tagline {
        position: fixed;
        bottom: clamp(16px, 3vh, 32px);
        left: 0;
        right: 0;
        text-align: center;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        will-change: opacity;
      }
      #tagline span {
        font-size: clamp(8px, 1.5vw, 11px);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
      }
      .rd {
        display: inline-block;
        width: 3px;
        height: 3px;
        background: #ec2227;
        border-radius: 50%;
        margin: 0 11px;
        vertical-align: middle;
        animation: dp 2.4s ease-in-out infinite;
      }
      @keyframes dp {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.25;
          transform: scale(0.35);
        }
      }

      /* ── CURSOR ── */
      #cg {
        position: fixed;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(236, 34, 39, 0.06) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 1;
        transform: translate(-50%, -50%);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="cg"></div>

    <div id="sr"><div id="track"></div></div>

    <div id="stage">
      <!-- LEFT RIBBON: 4 pieces fly from left -->
      <div class="rp lp lp0" id="p-A3">
        <img class="piece-svg" src="assets/SVG/Asset 3.svg" />
      </div>
      <div class="rp lp lp1" id="p-A8">
        <img class="piece-svg" src="assets/SVG/Asset 8.svg" />
      </div>
      <div class="rp lp lp2" id="p-A11">
        <img class="piece-svg" src="assets/SVG/Asset 11.svg" />
      </div>
      <div class="rp lp lp3" id="p-A12">
        <img class="piece-svg" src="assets/SVG/Asset 12.svg" />
      </div>

      <!-- RIGHT RIBBON: 6 pieces fly from right -->
      <div class="rp rp-el rp0" id="p-A5">
        <img class="piece-svg" src="assets/SVG/Asset 5.svg" />
      </div>
      <div class="rp rp-el rp1" id="p-A6">
        <img class="piece-svg" src="assets/SVG/Asset 6.svg" />
      </div>
      <div class="rp rp-el rp2" id="p-A13">
        <img class="piece-svg" src="assets/SVG/Asset 13.svg" />
      </div>
      <div class="rp rp-el rp3" id="p-A14">
        <img class="piece-svg" src="assets/SVG/Asset 14.svg" />
      </div>
      <div class="rp rp-el rp4" id="p-A10">
        <img class="piece-svg" src="assets/SVG/Asset 10.svg" />
      </div>
      <div class="rp rp-el rp5" id="p-A9">
        <img class="piece-svg" src="assets/SVG/Asset 9.svg" />
      </div>
    </div>
    <!-- /stage -->

    <!-- Knot flash -->
    <div id="knot-flash"></div>

    <!-- Final logo -->
    <div id="logo">
      <img src="assets/logo.jpg" />
    </div>

    <!-- Scroll hint -->
    <div id="hint">
      <div class="sline"></div>
      <span>scroll</span>
    </div>

    <!-- Tagline -->
    <div id="tagline">
      <span>Onkel Hasan</span>
      <span class="rd"></span>
      <span>Original</span>
      <span class="rd"></span>
      <span>Authentic</span>
    </div>

    <script>
      // ─────────────────────────────────────────────────────────
      //  CANVAS BACKGROUND — cyan particle network
      // ─────────────────────────────────────────────────────────
      const bgCanvas = document.getElementById("bg");
      const bgCtx = bgCanvas.getContext("2d");

      let W = 0,
        H = 0;

      function resizeBg() {
        W = bgCanvas.width = window.innerWidth;
        H = bgCanvas.height = window.innerHeight;
      }
      resizeBg();
      window.addEventListener("resize", resizeBg);

      // Particles
      const particles = [];
      const PARTICLE_COUNT = 120;

      function initParticles() {
        particles.length = 0;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            r: Math.random() * 2 + 1,
          });
        }
      }
      initParticles();
      window.addEventListener("resize", initParticles);

      // Mouse interaction
      let mx = W / 2,
        my = H / 2;
      window.addEventListener("mousemove", (e) => {
        mx = e.clientX;
        my = e.clientY;
        particles.forEach((p) => {
          const dx = p.x - mx;
          const dy = p.y - my;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100) {
            p.vx += dx * 0.0005;
            p.vy += dy * 0.0005;
          }
        });
      });

      // Ribbon trail segments
      const trailSegs = [];
      function addTrail(x, y, col, alpha) {
        trailSegs.push({ x, y, col, alpha, life: 0, maxL: 60 });
      }

      function drawBg() {
        bgCtx.clearRect(0, 0, W, H);

        // Dark base
        bgCtx.fillStyle = "#060d1a";
        bgCtx.fillRect(0, 0, W, H);

        // Subtle red vignette at bottom (keeps brand feel)
        const rg = bgCtx.createRadialGradient(
          W * 0.5,
          H,
          0,
          W * 0.5,
          H,
          H * 0.6,
        );
        rg.addColorStop(0, "rgba(236,34,39,0.04)");
        rg.addColorStop(1, "rgba(236,34,39,0)");
        bgCtx.fillStyle = rg;
        bgCtx.fillRect(0, 0, W, H);

        // Update + draw particles
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > W) p.vx *= -1;
          if (p.y < 0 || p.y > H) p.vy *= -1;

          // Dot
          bgCtx.beginPath();
          bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          bgCtx.fillStyle = "rgba(0,255,255,0.6)";
          bgCtx.fill();

          // Link lines
          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              bgCtx.strokeStyle = "rgba(0,255,255,0.08)";
              bgCtx.lineWidth = 1;
              bgCtx.beginPath();
              bgCtx.moveTo(p.x, p.y);
              bgCtx.lineTo(p2.x, p2.y);
              bgCtx.stroke();
            }
          }
        }

        // Ribbon trails on top
        for (let i = trailSegs.length - 1; i >= 0; i--) {
          const s = trailSegs[i];
          const f = 1 - s.life / s.maxL;
          bgCtx.save();
          bgCtx.globalAlpha = s.alpha * f * 0.4;
          bgCtx.fillStyle = s.col;
          bgCtx.beginPath();
          bgCtx.arc(s.x, s.y, 3 * f, 0, Math.PI * 2);
          bgCtx.fill();
          bgCtx.restore();
          s.life++;
          if (s.life >= s.maxL) trailSegs.splice(i, 1);
        }
      }

      // ─────────────────────────────────────────────────────────
      //  PIECES SETUP
      // ─────────────────────────────────────────────────────────
      const leftIds = ["p-A3", "p-A8", "p-A11", "p-A12"];
      const rightIds = ["p-A5", "p-A6", "p-A13", "p-A14", "p-A10", "p-A9"];

      const leftEls = leftIds.map((id) => document.getElementById(id));
      const rightEls = rightIds.map((id) => document.getElementById(id));
      const allEls = [...leftEls, ...rightEls];

      allEls.forEach((el) => {
        el.style.opacity = "0";
        el.style.transform = "translate(-50%,-50%)";
      });

      // ─────────────────────────────────────────────────────────
      //  RIBBON PATH MATH
      // ─────────────────────────────────────────────────────────
      function getRibbonPos(side, pieceIdx, totalInSide, t, phase) {
        const cx = W * 0.5,
          cy = H * 0.5;
        const staggerOffset = pieceIdx * 0.08;
        const tAdj = Math.max(0, t - staggerOffset);
        let x, y, rot, scale, opacity;

        if (side === "L") {
          const startX = -150;
          x = lerp(startX, cx, ease(tAdj));
          const wAmp = (1 - tAdj) * H * 0.3;
          y =
            cy + Math.sin(tAdj * Math.PI * 2.5 + pieceIdx * 1.1 + phase) * wAmp;
          rot = lerp(
            -45 - pieceIdx * 15,
            pieceIdx % 2 === 0 ? 15 : -10,
            ease(tAdj),
          );
          scale = lerp(0.3, 0.85, ease(tAdj));
          opacity = tAdj < 0.05 ? tAdj / 0.05 : 1;
        } else {
          const startX = W + 150;
          x = lerp(startX, cx, ease(tAdj));
          const wAmp = (1 - tAdj) * H * 0.3;
          y =
            cy +
            Math.sin(tAdj * Math.PI * 2.5 + pieceIdx * 1.3 + phase + Math.PI) *
              wAmp;
          rot = lerp(
            45 + pieceIdx * 12,
            pieceIdx % 2 === 0 ? -12 : 8,
            ease(tAdj),
          );
          scale = lerp(0.3, 0.85, ease(tAdj));
          opacity = tAdj < 0.05 ? tAdj / 0.05 : 1;
        }

        return { x, y, rot, scale, opacity };
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }
      function ease(t) {
        t = Math.max(0, Math.min(1, t));
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      // ─────────────────────────────────────────────────────────
      //  SCROLL DRIVEN ANIMATION
      // ─────────────────────────────────────────────────────────
      const scrollRoot = document.getElementById("sr");
      const hint = document.getElementById("hint");
      const tagline = document.getElementById("tagline");
      const logo = document.getElementById("logo");
      const knotFlash = document.getElementById("knot-flash");

      let scrollP = 0;

      scrollRoot.addEventListener(
        "scroll",
        () => {
          const sY = scrollRoot.scrollTop;
          const sH = scrollRoot.scrollHeight - scrollRoot.clientHeight;
          scrollP = Math.min(sY / sH, 1);
          updateScene();
        },
        { passive: true },
      );

      function updateScene() {
        const p = scrollP;

        hint.style.opacity = Math.max(0, 1 - p * 5);

        const ribbonP = Math.min(p / 0.72, 1);

        leftEls.forEach((el, i) => {
          const pos = getRibbonPos("L", i, leftEls.length, ribbonP, i * 0.7);
          el.style.left = pos.x + "px";
          el.style.top = pos.y + "px";
          el.style.transform = `translate(-50%,-50%) rotate(${pos.rot}deg) scale(${pos.scale})`;
          el.style.opacity = pos.opacity;
          if (ribbonP > 0.05 && ribbonP < 0.72 && Math.random() < 0.3)
            addTrail(pos.x, pos.y, "#ffffff", 0.3);
        });

        rightEls.forEach((el, i) => {
          const pos = getRibbonPos(
            "R",
            i,
            rightEls.length,
            ribbonP,
            i * 0.9 + 0.5,
          );
          el.style.left = pos.x + "px";
          el.style.top = pos.y + "px";
          el.style.transform = `translate(-50%,-50%) rotate(${pos.rot}deg) scale(${pos.scale})`;
          el.style.opacity = pos.opacity;
          if (ribbonP > 0.05 && ribbonP < 0.72 && Math.random() < 0.3)
            addTrail(pos.x, pos.y, "#ec2227", 0.25);
        });

        if (p > 0.72) {
          const kP = Math.min((p - 0.72) / 0.1, 1);

          leftEls.forEach((el, i) => {
            const stag = i * 0.06;
            const lkP = ease(
              Math.max(0, Math.min((kP - stag) / (1 - stag * 3), 1)),
            );
            el.style.left = W * 0.5 + "px";
            el.style.top = H * 0.5 + "px";
            const scIn = lerp(0.85, 0.0, lkP);
            const rotIn = lerp(0, 360 * (i % 2 === 0 ? 1 : -1), lkP);
            el.style.transform = `translate(-50%,-50%) rotate(${rotIn}deg) scale(${scIn})`;
            el.style.opacity = 1 - lkP;
          });

          rightEls.forEach((el, i) => {
            const stag = i * 0.05;
            const lkP = ease(
              Math.max(0, Math.min((kP - stag) / (1 - stag * 4), 1)),
            );
            el.style.left = W * 0.5 + "px";
            el.style.top = H * 0.5 + "px";
            const scIn = lerp(0.85, 0.0, lkP);
            const rotIn = lerp(0, 360 * (i % 2 === 0 ? -1 : 1), lkP);
            el.style.transform = `translate(-50%,-50%) rotate(${rotIn}deg) scale(${scIn})`;
            el.style.opacity = 1 - lkP;
          });

          const flashP = kP < 0.5 ? kP / 0.5 : 1 - (kP - 0.5) / 0.5;
          knotFlash.style.opacity = flashP * 0.7;
        } else {
          knotFlash.style.opacity = 0;
        }

        if (p > 0.82) {
          const lP = Math.min((p - 0.82) / 0.15, 1);
          const lE = ease(lP);
          logo.style.opacity = lE;
          logo.style.transform = `translate(-50%,-50%) scale(${lerp(0.5, 1, lE)})`;
          logo.style.pointerEvents = lP > 0.5 ? "auto" : "none";
          const glow = Math.round(lE * 40);
          logo.style.filter = `drop-shadow(0 0 ${glow}px rgba(236,34,39,${lE * 0.6}))`;
        } else {
          logo.style.opacity = 0;
          logo.style.transform = "translate(-50%,-50%) scale(0.5)";
          logo.style.filter = "none";
        }

        const tP = Math.max(0, Math.min((p - 0.9) / 0.08, 1));
        tagline.style.opacity = ease(tP);
      }

      // ─────────────────────────────────────────────────────────
      //  ENTRANCE
      // ─────────────────────────────────────────────────────────
      function enterPieces() {
        leftEls.forEach((el, i) => {
          el.style.transition = "none";
          el.style.left = "-200px";
          el.style.top = H * 0.25 + i * (H * 0.18) + "px";
          el.style.transform = `translate(-50%,-50%) rotate(${-30 - i * 20}deg) scale(0.2)`;
          el.style.opacity = "0";
        });
        rightEls.forEach((el, i) => {
          el.style.transition = "none";
          el.style.left = W + 200 + "px";
          el.style.top = H * 0.25 + i * (H * 0.12) + "px";
          el.style.transform = `translate(-50%,-50%) rotate(${30 + i * 15}deg) scale(0.2)`;
          el.style.opacity = "0";
        });

        leftEls.forEach((el, i) => {
          setTimeout(
            () => {
              el.style.transition =
                "left 1.2s cubic-bezier(0.16,1,0.3,1), top 1.2s cubic-bezier(0.16,1,0.3,1), transform 1.2s cubic-bezier(0.16,1,0.3,1), opacity .8s ease";
              el.style.left = W * 0.12 + i * (W * 0.06) + "px";
              el.style.top =
                H * 0.25 + i * (H * 0.18) + Math.sin(i) * 40 + "px";
              el.style.transform = `translate(-50%,-50%) rotate(${-15 + i * 10}deg) scale(0.8)`;
              el.style.opacity = "0.85";
            },
            200 + i * 140,
          );
        });

        rightEls.forEach((el, i) => {
          setTimeout(
            () => {
              el.style.transition =
                "left 1.2s cubic-bezier(0.16,1,0.3,1), top 1.2s cubic-bezier(0.16,1,0.3,1), transform 1.2s cubic-bezier(0.16,1,0.3,1), opacity .8s ease";
              el.style.left = W * 0.85 - i * (W * 0.06) + "px";
              el.style.top =
                H * 0.25 + i * (H * 0.12) + Math.sin(i + 2) * 40 + "px";
              el.style.transform = `translate(-50%,-50%) rotate(${15 - i * 8}deg) scale(0.8)`;
              el.style.opacity = "0.85";
            },
            200 + i * 120,
          );
        });

        setTimeout(() => {
          allEls.forEach((el) => {
            el.style.transition = "none";
          });
          startIdleFloat();
        }, 1800);
      }

      // ─────────────────────────────────────────────────────────
      //  IDLE FLOAT
      // ─────────────────────────────────────────────────────────
      let idleT = 0,
        idleRunning = false;
      const idlePos = [];

      function storeIdlePos() {
        idlePos.length = 0;
        allEls.forEach((el) => {
          const left = parseFloat(el.style.left) || 0;
          const top = parseFloat(el.style.top) || 0;
          const m = el.style.transform.match(/rotate\(([^d]+)deg\)/);
          const rot = m ? parseFloat(m[1]) : 0;
          idlePos.push({ left, top, rot });
        });
      }

      function startIdleFloat() {
        storeIdlePos();
        idleRunning = true;
        function tick() {
          if (!idleRunning || scrollP > 0.02) return;
          idleT += 0.012;
          allEls.forEach((el, i) => {
            if (i >= idlePos.length) return;
            const base = idlePos[i];
            const dy = Math.sin(idleT * 1.1 + i * 0.8) * 7;
            const dx = Math.cos(idleT * 0.7 + i * 0.6) * 4;
            const dr = Math.sin(idleT * 0.9 + i * 1.1) * 3;
            el.style.left = base.left + dx + "px";
            el.style.top = base.top + dy + "px";
            el.style.transform = `translate(-50%,-50%) rotate(${base.rot + dr}deg) scale(0.8)`;
          });
          requestAnimationFrame(tick);
        }
        tick();
      }

      // ─────────────────────────────────────────────────────────
      //  CURSOR GLOW
      // ─────────────────────────────────────────────────────────
      const cg = document.getElementById("cg");
      let cgx = W / 2,
        cgy = H / 2,
        cmx = W / 2,
        cmy = H / 2;
      document.addEventListener("mousemove", (e) => {
        cmx = e.clientX;
        cmy = e.clientY;
      });
      (function gl() {
        cgx += (cmx - cgx) * 0.06;
        cgy += (cmy - cgy) * 0.06;
        cg.style.left = cgx + "px";
        cg.style.top = cgy + "px";
        requestAnimationFrame(gl);
      })();

      // ─────────────────────────────────────────────────────────
      //  LOGO CLICK
      // ─────────────────────────────────────────────────────────
      logo.addEventListener("click", () => {
        logo.animate(
          [
            { filter: "drop-shadow(0 0 20px rgba(236,34,39,.5))" },
            {
              filter: "drop-shadow(0 0 80px rgba(236,34,39,1)) brightness(1.3)",
            },
            { filter: "drop-shadow(0 0 20px rgba(236,34,39,.5))" },
          ],
          { duration: 600, easing: "ease-out" },
        );
      });

      // ─────────────────────────────────────────────────────────
      //  MAIN LOOP
      // ─────────────────────────────────────────────────────────
      function loop() {
        drawBg();
        requestAnimationFrame(loop);
      }
      loop();

      setTimeout(enterPieces, 300);
    </script>
