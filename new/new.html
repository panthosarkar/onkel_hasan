<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onkel Hasan</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap");
      :root {
        --bg-color: #0a0a0c;
        --text-color: #ffffff;
        --accent-color: #f91d26;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 500vh; /* Increased height for more sections */
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Dancing Script", cursive;
        overflow-x: hidden;
      }

      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 1;
      }

      #trail-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 10;
        pointer-events: none;
      }

      /* Parallax SVG Layers */
      .parallax-svg-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }

      .parallax-layer {
        position: absolute;
        opacity: 0.6;
      }

      .hero-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
        pointer-events: none;
      }

      /* Content Sections */
      .content-section {
        position: relative;
        z-index: 6;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 10%;
        text-align: center;
        pointer-events: none; /* Allow clicking through to the canvas if needed */
      }

      .content-section h2 {
        font-size: 4rem;
        color: var(--accent-color);
        margin-bottom: 1rem;
      }

      .content-section p {
        font-size: 1.5rem;
        max-width: 600px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      .title-wrapper {
        overflow: hidden;
      }

      h1 {
        font-size: clamp(2rem, 10vw, 6rem);
        font-weight: 900;
        letter-spacing: 0.1em;
        margin: 0;
        text-transform: uppercase;
      }

      .char {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <!-- WebGL Background Containers -->
    <div id="canvas-container"></div>
    <canvas id="trail-canvas"></canvas>

    <!-- Parallax SVGs -->
    <div class="parallax-svg-container">
      <img
        src="SVG/shape1.svg"
        class="parallax-layer"
        data-speed="0.15"
        style="top: 20%; left: 5%; width: 120px"
      />
      <img
        src="SVG/shape2.svg"
        class="parallax-layer"
        data-speed="-0.1"
        style="top: 60%; left: 85%; width: 180px"
      />
      <img
        src="SVG/shape3.svg"
        class="parallax-layer"
        data-speed="0.25"
        style="top: 30%; left: 75%; width: 90px"
      />
      <img
        src="SVG/shape1.svg"
        class="parallax-layer"
        data-speed="-0.2"
        style="top: 80%; left: 15%; width: 140px"
      />
    </div>

    <div class="hero-overlay">
      <div class="title-wrapper">
        <h1 id="hero-title">ONKEL HASAN</h1>
      </div>
    </div>

    <section class="content-section">
      <!-- Spacer for Hero -->
    </section>

    <section class="content-section">
      <h2>Discovery</h2>
      <p>
        Journey through the digital terrain where every interaction leaves a
        trail of light.
      </p>
    </section>

    <section class="content-section">
      <h2>Innovation</h2>
      <p>
        Blending world-class engineering with creative design to build immersive
        experiences.
      </p>
    </section>

    <!-- External Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Main Script for Terrain and Interaction logic -->
    <script src="script.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Split text into individual characters for staggered animation
        const title = document.getElementById("hero-title");
        const text = title.textContent;
        title.innerHTML = "";

        [...text].forEach((char) => {
          const span = document.createElement("span");
          span.className = "char";
          span.innerHTML = char === " " ? "&nbsp;" : char;
          title.appendChild(span);
        });

        const chars = document.querySelectorAll(".char");

        // Splitting "ONKEL" (5 letters): 'ONK' as first half, 'EL' and the rest as second half
        const splitIndex = 3;
        const leftSide = Array.from(chars).slice(0, splitIndex);
        const rightSide = Array.from(chars).slice(splitIndex);

        const tl = gsap.timeline({ delay: 0.4 });

        // First half (ONK): Animate in from left to right
        tl.from(
          leftSide,
          {
            xPercent: -150,
            opacity: 0,
            duration: 1.4,
            stagger: 0.1,
            ease: "power4.out",
          },
          0,
        );

        // The rest (EL HASAN): Animate in from right to left
        tl.from(
          rightSide,
          {
            xPercent: 150,
            opacity: 0,
            duration: 1.4,
            stagger: 0.1,
            ease: "power4.out",
          },
          0,
        );

        // Transformation sequence: Letters rotate and turn into glowing orbs
        tl.to(
          chars,
          {
            rotation: 360,
            scale: 0.3,
            borderRadius: "50%",
            backgroundColor: "#f91d26", // Matches comet trail color
            color: "transparent",
            duration: 1.2,
            stagger: 0.05,
            ease: "back.in(1.7)",
          },
          "+=0.5",
        );

        // Return to original letter form
        tl.to(
          chars,
          {
            rotation: 0,
            scale: 1,
            borderRadius: "0%",
            backgroundColor: "transparent",
            color: "#ffffff",
            duration: 1.2,
            stagger: 0.05,
            ease: "elastic.out(1, 0.5)",
          },
          "+=0.3",
        );
      });
    </script>
  </body>
</html>
